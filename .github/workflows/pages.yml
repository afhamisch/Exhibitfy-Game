# Deploys the playable prototype to GitHub Pages on every push to the game
# branch. The site is just static files -- web/ and build/ side by side, which
# is the only structural requirement (main.js fetches ../build) -- plus a root
# redirect into web/. No build step: the repo ships its own assets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/tom-rexington-fpv-arms-4asalw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir _site
          cp -r web build index.html _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
